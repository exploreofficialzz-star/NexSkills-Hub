org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# Jetifier migrates old support-library deps to AndroidX at build time.
# All Flutter plugins in this project already use AndroidX natively, so
# Jetifier is unnecessary. Keeping it enabled causes JetifyTransform to
# crash on modern JARs compiled with Java 21+ (bcprov, byte-buddy, etc.).
android.enableJetifier=false
