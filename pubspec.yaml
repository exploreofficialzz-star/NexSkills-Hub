name: nexskills_hub
description: NexSkills Hub - Your daily tech career journey by chAs Tech Group
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # RSS & HTTP
  dart_rss: ^3.0.2
  http: ^1.2.0

  # Video & Web Content
  youtube_player_flutter: ^9.1.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.0

  # Ads
  google_mobile_ads: ^5.1.0

  # In-App Purchase
  in_app_purchase: ^3.1.13

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.2

dependency_overrides:
  # webfeed 0.7.0 pins intl ^0.17.0 but we need ^0.19.0.
  # intl 0.19.x is backward-compatible so this override is safe.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#0A0E1A"
  ios: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/json/learning_paths.json
    - assets/images/app_icon.png
    - assets/images/chas_logo.png
    - assets/images/
